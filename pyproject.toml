
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insightforge-enterprise"
version = "0.1.0"
description = "An evaluated agentic customer intelligence and experimentation platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.5,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pandas>=2.2,<4.0",
    "numpy>=1.26,<3.0",
    "scikit-learn>=1.5,<2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.38,<2.0",
    "plotly>=5.24,<7.0",
]
rag = [
    "fastembed>=0.7,<1.0",
    "rank-bm25>=0.2,<1.3",
]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
